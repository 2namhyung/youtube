<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>경찰 아버지가 부순 휴대전화 — evidence motion v2</title>
<style>

*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}body{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--white)}

.relations{position:absolute;inset:20px}.role{position:absolute;width:260px;padding:25px;border:2px solid var(--line);border-radius:22px;background:#142331;text-align:center}.role strong{display:block;font-size:29px}.role small{display:block;margin-top:9px;color:var(--muted);font-size:19px;font-weight:800}.face{width:70px;height:70px;margin:0 auto 15px;border-radius:50%;background:var(--paper)}.r-son{left:0;top:30px}.r-teacher{right:0;top:30px}.r-father{left:346px;bottom:10px;border-color:#805f31}.connector{position:absolute;height:3px;background:var(--line);transform-origin:left}.c1{left:260px;top:135px;width:394px}.c2{left:475px;top:138px;width:250px;transform:rotate(90deg)}.event{position:absolute;left:337px;top:52px;width:280px;padding:18px;border:2px solid #773e43;border-radius:18px;background:#331d22;color:#ffd8d4;text-align:center;font-size:23px;font-weight:950}
.doc{inset:30px 72px;padding:40px;background:var(--paper);color:#18242d;transform:rotate(-1.5deg)}.doc-top{display:flex;justify-content:space-between;border-bottom:4px solid #23323e;padding-bottom:22px;font-size:22px;font-weight:950}.doc-body{margin-top:70px;font-size:43px;line-height:1.55;font-weight:950}.mark{padding:2px 8px;background:#ffd665}.stamp{position:absolute;right:45px;bottom:42px;padding:13px 20px;border:5px solid #c84842;color:#c84842;font-size:27px;font-weight:950;transform:rotate(-8deg)}
.timeline{inset:45px 20px;background:transparent;border:0;box-shadow:none}.rail{position:absolute;left:90px;right:90px;height:6px;background:var(--line)}.rail.one{top:190px}.rail.two{top:470px}.node{position:absolute;width:34px;height:34px;border-radius:50%;border:7px solid var(--cyan);background:var(--ink)}.n1{left:120px;top:176px}.n2{right:120px;top:176px}.n3{left:120px;top:456px;border-color:var(--amber)}.n4{right:120px;top:456px;border-color:var(--red)}.time-label{position:absolute;width:285px;font-size:25px;font-weight:950}.tl1{left:95px;top:90px}.tl2{right:70px;top:90px;text-align:right}.tl3{left:95px;top:525px}.tl4{right:70px;top:525px;text-align:right;color:var(--red)}.lane{position:absolute;left:90px;top:326px;color:var(--muted);font-size:20px;font-weight:900;letter-spacing:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;inset:25px 0;background:transparent;border:0;box-shadow:none}.half{position:relative;padding:36px;border:2px solid var(--line);border-radius:28px;background:#12202c}.half h3{margin:0 0 28px;font-size:31px}.half .giant{font-size:82px;line-height:1;font-weight:950}.half.bad{border-color:#734044}.half.bad .giant{color:var(--red)}.half.good .giant{color:var(--cyan)}.mini-card{margin-top:42px;padding:20px;border-left:7px solid currentColor;background:#0c1720;font-size:25px;line-height:1.4;font-weight:900}
.quote{inset:65px 36px;padding:58px;background:var(--paper);color:#17242d}.quote:before{content:"“";position:absolute;left:35px;top:5px;color:var(--cyan);font-size:170px;font-family:serif}.quote p{margin:90px 10px 30px;font-size:49px;line-height:1.45;font-weight:950}.quote small{display:block;border-top:3px solid #95a2aa;padding-top:25px;font-size:21px;font-weight:900;color:#53636f}
.steps{inset:40px 30px;background:transparent;border:0;box-shadow:none}.step{height:142px;margin-bottom:24px;padding:33px 34px;border:2px solid var(--line);border-radius:22px;background:#111f2b;font-size:30px;font-weight:950}.step i{display:inline-flex;width:48px;height:48px;margin-right:22px;border-radius:50%;align-items:center;justify-content:center;background:var(--cyan);color:#071017;font-style:normal}.step.pending{opacity:.45}.step.warn{border-color:#78542c}.step.warn i{background:var(--amber)}
.barrier{inset:35px 30px;background:transparent;border:0;box-shadow:none}.family{position:absolute;left:50px;top:25px;width:300px;padding:28px;border:2px solid var(--line);border-radius:24px;background:#12202d;text-align:center;font-size:30px;font-weight:950}.law{position:absolute;right:50px;top:25px;width:400px;padding:28px;border:2px solid var(--line);border-radius:24px;background:#12202d;text-align:center;font-size:27px;font-weight:950}.wall{position:absolute;left:430px;top:150px;width:80px;height:420px;background:repeating-linear-gradient(0deg,#80454a 0 42px,#b75c60 42px 48px);box-shadow:0 0 40px #ff655d44}.route{position:absolute;left:70px;right:70px;bottom:30px;display:grid;grid-template-columns:1fr 90px 1fr;align-items:center}.route div{padding:25px;border:2px solid var(--line);border-radius:20px;background:#111f2b;text-align:center;font-size:27px;font-weight:950}.route b{text-align:center;color:var(--red);font-size:45px}
.return{inset:25px;background:transparent;border:0;box-shadow:none}.chain{position:absolute;left:60px;right:60px;top:280px;height:16px;background:linear-gradient(90deg,var(--cyan) 0 44%,transparent 44% 56%,var(--red) 56%)}.chain:after{content:"증거 연쇄 단절";position:absolute;left:326px;top:55px;color:var(--red);font-size:30px;font-weight:950}.return .phone{transform:scale(.62);transform-origin:center top;left:340px;top:0}.question{position:absolute;left:20px;right:20px;bottom:40px;font-size:55px;line-height:1.25;text-align:center;font-weight:950;letter-spacing:-3px}
.caption{position:absolute;z-index:5;left:64px;right:64px;top:1350px;min-height:310px;padding:34px 38px;border-radius:24px;background:var(--paper);color:#101820;box-shadow:0 14px 0 #283c4c;font-size:43px;line-height:1.42;font-weight:950;letter-spacing:-2px;display:flex;align-items:center;justify-content:center;text-align:center}.caption .hot{color:#c63c39}.caption .sub{color:#13657a}
.progress{position:absolute;z-index:5;left:64px;right:64px;bottom:112px;height:6px;background:#243443}.progress i{display:block;height:100%;background:var(--cyan)}.footer{position:absolute;z-index:5;left:64px;right:64px;bottom:54px;display:flex;justify-content:space-between;color:#899ca9;font-size:17px;font-weight:900}
</style></head><body><main id="stage"><header class="mast"><div class="headline"><b>경찰 아버지가</b><br>부순 휴대전화</div><div class="source"></div><div class="counter"></div></header><section class="scene"><div class="kicker"></div><div class="title"></div><div class="badge"></div><div class="visual"></div></section><div class="caption"></div><div class="progress"><i></i></div><footer class="footer"><span>보도된 사실 기반 그래픽 재구성 · 실제 인물·화면 아님</span><span>비공개 디자인 샘플</span></footer></main>
<script>
const scenes=[
{k:'EVIDENCE RECORD',t:'고소 사건의 <span class="warm">핵심 증거</span>',b:'SPAN 001 · 보도된 사실',cap:'핵심 증거는 <span class="sub">학생의 휴대전화</span>였습니다.',type:'phone',state:'intact'},
{k:'BREACH STATE',t:'그 증거가 <span class="hot">사라졌습니다</span>',b:'재구성 · 파손 방법 묘사 안 함',cap:'증거를 없앤 사람은<br><span class="hot">학생의 경찰관 아버지</span>였습니다.',type:'phone',state:'broken'},
{k:'SPATIAL CONTEXT',t:'사건의 공적 역할',b:'SPAN 002 · 위치 맥락',cap:'전북 전주의 한 파출소 소속<br><span class="sub">A 경감</span>',type:'map'},
{k:'RELATIONSHIP MAP',t:'세 사람의 관계',b:'SPAN 002 · 신원 비식별',cap:'고등학생 아들 → 여교사 대상<br><span class="hot">불법 촬영 시도</span>',type:'relations'},
{k:'EVIDENCE RECORD',t:'내부망에 남은 기록',b:'SPAN 002 · 당사자 기록',cap:'A 경감은 휴대전화를<br><span class="hot">부쉈다고 내부망에 적었습니다.</span>',type:'doc'},
{k:'INVESTIGATION PROGRESS',t:'아들 사건은 검찰로',b:'SPAN 003 · 보도된 사실',cap:'아들은 지난달 말<br><span class="sub">검찰에 넘겨졌습니다.</span>',type:'steps',active:1},
{k:'DUAL TIMELINE',t:'그러나 아버지 행동은',b:'SPAN 004 · 시점 비교',cap:'A 경감의 행동은<br><span class="hot">곧바로 드러나지 않았습니다.</span>',type:'timeline',phase:1},
{k:'DISCOVERY TIMELINE',t:'전수조사가 찾아낸 연결',b:'SPAN 004 · 뒤늦은 확인',cap:'경찰 가족 연루 사건 전수조사에서<br><span class="hot">뒤늦게 확인됐습니다.</span>',type:'timeline',phase:2},
{k:'ROLE CONFLICT',t:'가족과 증거 의무 사이',b:'SPAN 005 · 책임 대비',cap:'증거를 지켜야 할 현직 경찰 간부가<br><span class="hot">가족 사건의 증거를 없앤 셈</span>',type:'split'},
{k:'VICTIM AFTERMATH',t:'조직 안에서도 나온 비판',b:'SPAN 006 · 보도된 동료 반응',cap:'“피해 교사도<br><span class="hot">누군가의 자식</span>이다”',type:'quote'},
{k:'INVESTIGATION PROGRESS',t:'경찰 간부를 입건',b:'SPAN 007 · 보도된 사실',cap:'경찰은 A 경감을<br><span class="sub">증거 인멸 혐의로 입건</span>',type:'steps',active:1},
{k:'INVESTIGATION PROGRESS',t:'자택 압수수색',b:'SPAN 007 · 보도된 사실',cap:'지난주에는<br><span class="sub">자택을 압수수색했습니다.</span>',type:'steps',active:2},
{k:'INVESTIGATION STATUS',t:'수사 개입 의혹',b:'SPAN 008 · 확인 중',cap:'수사 개입 의혹도<br><span class="warm">확인하고 있습니다.</span>',type:'steps',active:3},
{k:'LEGAL COMPARISON',t:'직계혈족이라는 장벽',b:'SPAN 009 · 경찰 설명상',cap:'직계혈족은 친족 간 처벌특례규정 때문에<br><span class="hot">처벌할 수 없다는 설명</span>',type:'barrier',phase:1},
{k:'LEGAL COMPARISON',t:'수사는 가능',b:'SPAN 010 · 절차와 처벌 분리',cap:'<span class="sub">입건과 수사</span>는 가능해도',type:'barrier',phase:2},
{k:'LEGAL GAP',t:'처벌에는 간극',b:'SPAN 010 · 제도적 결과',cap:'실제 처벌에는<br><span class="hot">간극이 남았습니다.</span>',type:'barrier',phase:3},
{k:'RETURN TEST',t:'다시, 끊어진 증거',b:'SPAN 011 · 공적 신뢰',cap:'가족이 연루되자<br><span class="hot">핵심 증거를 없앤 경찰</span>',type:'return',phase:1},
{k:'PUBLIC POINT OF VIEW',t:'우리가 맡기는 수사',b:'SPAN 011 · 시청자 질문',cap:'우리는 경찰의 수사를<br><span class="sub">다시 믿고 맡길 수 있을까요?</span>',type:'return',phase:2}
];
const bounds=[0,60,144,216,288,384,456,528,624,720,816,888,960,1008,1080,1152,1200,1272,1321],fps=24,total=1321;
const frame=Number(new URLSearchParams(location.search).get('frame')||0),idx=Math.max(0,Math.min(17,bounds.findIndex((v,i)=>i<18&&frame>=v&&frame<bounds[i+1]))),s=scenes[idx],local=(frame-bounds[idx])/(bounds[idx+1]-bounds[idx]);
const reconstructed=new Set([0,1,4,16]),sourceKind=reconstructed.has(idx)?'LABELED RECONSTRUCTION':'DERIVED DIAGRAM',evidenceStatus=idx>=16?'INFERENCE':'STATEMENT',disclosure=reconstructed.has(idx)?'사건 내용 기반 AI 재구성':'검증 사실 기반 도식';
document.querySelector('.kicker').textContent=s.k;document.querySelector('.title').innerHTML=s.t;document.querySelector('.badge').textContent=s.b;document.querySelector('.caption').innerHTML=s.cap;document.querySelector('.source').textContent=sourceKind+' · '+evidenceStatus;document.querySelector('.footer span').textContent=disclosure+' · 실제 인물·화면 아님';document.querySelector('.counter').textContent=String(idx+1).padStart(2,'0')+' / 18';document.querySelector('.progress i').style.width=(frame/total*100)+'%';
const v=document.querySelector('.visual');
const phone=(broken=false)=>`<div class="panel" style="inset:18px 45px"><div class="phone ${broken?'broken':''}"></div>${broken?'<div class="phone-piece"></div>':''}<div class="state-row"><div class="state-chip">증거물 · 휴대전화</div><div class="arrow">→</div><div class="state-chip" style="color:${broken?'var(--red)':'var(--cyan)'}">${broken?'파손 상태':'온전한 상태'}</div></div></div>`;
const render={
phone:()=>phone(s.state==='broken'),
map:()=>`<div class="panel map"><div class="map-grid"></div><div class="pin"></div><div class="map-label">전북 전주 · 파출소 소속</div></div>`,
relations:()=>`<div class="relations"><div class="role r-son"><div class="face"></div><strong>고등학생 아들</strong><small>촬영 시도 당사자</small></div><i class="connector c1"></i><div class="event">여교사 대상<br>불법 촬영 시도</div><div class="role r-teacher"><div class="face"></div><strong>성인 여교사</strong><small>피해자</small></div><i class="connector c2"></i><div class="role r-father"><div class="face"></div><strong>경찰관 아버지</strong><small>A 경감</small></div></div>`,
doc:()=>`<div class="panel doc"><div class="doc-top"><span>내부망 기록</span><span>식별정보 비공개</span></div><div class="doc-body">아들 사건의 휴대전화를<br><span class="mark">부쉈다고 적음</span></div><div class="stamp">당사자 기록</div></div>`,
timeline:()=>`<div class="timeline"><div class="rail one"></div><i class="node n1"></i><i class="node n2"></i><div class="time-label tl1">아들 사건 적발</div><div class="time-label tl2">검찰 송치</div><div class="lane">별도로 진행된 경찰 가족 연루 사건 전수조사</div><div class="rail two"></div><i class="node n3"></i><i class="node n4" style="opacity:${s.phase===2?1:.25}"></i><div class="time-label tl3">전수조사 시작</div><div class="time-label tl4" style="opacity:${s.phase===2?1:.25}">아버지 행동 확인</div></div>`,
split:()=>`<div class="panel split"><div class="half good"><h3>경찰의 공적 의무</h3><div class="giant">증거<br>보존</div><div class="mini-card">수사의 신뢰를 지키는 역할</div></div><div class="half bad"><h3>가족 사건에서 한 행동</h3><div class="giant">증거<br>상실</div><div class="mini-card">역할과 행동의 충돌</div></div></div>`,
quote:()=>`<div class="panel quote"><p>피해 교사도<br>누군가의 자식이다</p><small>동료 경찰들의 비판으로 보도됨 · 직접 인물 재현 없음</small></div>`,
steps:()=>`<div class="steps"><div class="step ${s.active<1?'pending':''}"><i>1</i>증거 인멸 혐의 입건</div><div class="step ${s.active<2?'pending':''}"><i>2</i>자택 압수수색</div><div class="step warn ${s.active<3?'pending':''}"><i>3</i>수사 개입 의혹 확인 중</div></div>`,
barrier:()=>`<div class="barrier"><div class="family">직계혈족</div><div class="law">친족 간 처벌특례규정</div><div class="wall" style="opacity:${s.phase===1?1:.45}"></div><div class="route"><div style="color:var(--cyan)">입건 · 수사<br>가능</div><b>${s.phase===3?'≠':'→'}</b><div style="color:var(--red)">실제 처벌<br>${s.phase===3?'간극':'제한'}</div></div></div>`,
return:()=>`<div class="return">${phone(true)}<div class="chain"></div><div class="question">${s.phase===2?'수사를 다시 믿고<br>맡길 수 있을까요?':'증거를 지켜야 할 역할은<br>어디에서 끊겼나'}</div></div>`
};v.innerHTML=render[s.type]();v.style.opacity=String(Math.min(1,local*4,(1-local)*7));v.style.transform=`translateY(${(1-Math.min(1,local*5))*22}px)`;
</script></body></html>
